[project]
name = "keyloop-test"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "thuanrc", email = "thuanmd01@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.0",
    "prometheus-client>=0.26.0",
    "psycopg[binary]>=3.2",
    "sqlalchemy>=2.0",
    "tzdata>=2026.6",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
keyloop-test = "keyloop_test:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
